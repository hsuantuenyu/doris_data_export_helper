name: Build macOS App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel 架构 (x64)
          - arch: x64
            runner: macos-13
            display: Intel (x64)
          # Apple Silicon / M2 架构 (arm64)
          - arch: arm64
            runner: macos-14
            display: Apple Silicon (arm64)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build macOS app (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 环境无 Apple 开发者证书，禁用自动签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --${{ matrix.arch }}

      - name: Post-process app (remove quarantine + ad-hoc sign + build DMG)
        run: |
          echo "=== Post-processing app ==="
          echo "Files in dist:"
          ls -la dist/
          
          # 查找生成的 .app 文件
          cd dist
          APP_DIR=$(find . -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: .app file not found in dist/"
            ls -la
            exit 1
          fi
          echo "Found app directory: $APP_DIR"
          
          # 移除隔离属性
          xattr -r -d com.apple.quarantine "$APP_DIR" 2>/dev/null || true
          echo "Quarantine attribute removed"
          
          # ad-hoc 签名
          codesign --deep --force --sign - "$APP_DIR"
          echo "Ad-hoc signing completed"
          codesign --verify --deep --strict "$APP_DIR" && echo "Codesign verification passed" || echo "Codesign verification failed"
          
          # 清理旧产物
          rm -f ./*.zip ./*.dmg
          
          # 重命名为 ASCII 名称
          SAFE_APP="Doris-Export-Helper.app"
          SAFE_APP_PATH="$(pwd)/${SAFE_APP}"
          mv "$APP_DIR" "$SAFE_APP"
          echo "Renamed to: $SAFE_APP"
          
          # 创建 DMG 暂存目录（包含应用 + 快捷方式 + 修复脚本）
          STAGING="dmg_staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          
          # 复制 app 到暂存目录
          cp -R "$SAFE_APP_PATH" "$STAGING/"
          
          # 创建 Applications 文件夹快捷方式
          ln -s /Applications "$STAGING/Applications"
          
          # 创建首次打开修复脚本（用户双击即可解除隔离）
          cat > "$STAGING/首次打开请双击我.command" << 'SCRIPT_EOF'
          #!/bin/bash
          # 双击此文件可自动移除 macOS 隔离标记并启动应用
          cd "$(dirname "$0")"
          echo "正在移除隔离标记..."
          xattr -cr "Doris-Export-Helper.app" 2>/dev/null
          echo "正在启动应用..."
          open "Doris-Export-Helper.app"
          SCRIPT_EOF
          chmod +x "$STAGING/首次打开请双击我.command"
          
          # 创建说明文件
          cat > "$STAGING/使用说明.txt" << 'README_EOF'
          ============================================
            Doris 数据导出助手 - macOS 安装说明
          ============================================

          方式一（推荐）：
            1. 双击 "首次打开请双击我.command"
            2. 系统可能提示无法验证开发者，点击 "好"
            3. 前往 系统设置 → 隐私与安全性 → 点击 "仍要打开"
            4. 再次双击 "首次打开请双击我.command" 即可启动

          方式二：
            1. 将 Doris-Export-Helper.app 拖到 Applications 文件夹
            2. 打开终端，执行：xattr -cr /Applications/Doris-Export-Helper.app
            3. 在启动台中打开应用

          方式三：
            1. 将 Doris-Export-Helper.app 拖到 Applications 文件夹
            2. 右键点击应用 → 选择 "打开"
            3. 在弹窗中点击 "打开"
          README_EOF
          
          # 生成 DMG（从暂存目录）
          NEW_DMG="Doris-Export-Helper-${{ matrix.arch }}.dmg"
          hdiutil create -volname "Doris Export Helper" -srcfolder "$STAGING" -ov -format UDZO "$(pwd)/$NEW_DMG"
          if [ -f "$NEW_DMG" ]; then
            echo "Created DMG: $NEW_DMG ($(du -h "$NEW_DMG" | cut -f1))"
          else
            echo "Error: Failed to create DMG"
            exit 1
          fi
          
          # 生成 ZIP 包
          NEW_ZIP="Doris-Export-Helper-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$SAFE_APP_PATH" "$(pwd)/$NEW_ZIP"
          if [ -f "$NEW_ZIP" ]; then
            echo "Created ZIP: $NEW_ZIP ($(du -h "$NEW_ZIP" | cut -f1))"
          fi
          
          # 清理暂存目录和临时 app
          rm -rf "$STAGING" "$SAFE_APP"
          
          cd ..
          echo "Post-processing completed successfully"
          echo "Final files in dist:"
          ls -la dist/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doris-Export-Helper-macOS-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doris-Export-Helper-macOS-${{ matrix.arch }}-zip
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload latest-mac.yml (for auto-updater)
        uses: actions/upload-artifact@v4
        with:
          name: latest-mac-${{ matrix.arch }}
          path: dist/latest-mac.yml
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Release (on tag)
    needs: build-mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: find artifacts -type f

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/latest-mac.yml
          draft: true
          generate_release_notes: true
