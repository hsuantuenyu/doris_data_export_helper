name: Build macOS App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel 架构 (x64)
          - arch: x64
            runner: macos-13
            display: Intel (x64)
          # Apple Silicon / M2 架构 (arm64)
          - arch: arm64
            runner: macos-14
            display: Apple Silicon (arm64)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build macOS app (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 环境无 Apple 开发者证书，禁用自动签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --${{ matrix.arch }}

      - name: Post-process app (remove quarantine + ad-hoc sign)
        run: |
          echo "=== Post-processing app ==="
          echo "Files in dist:"
          ls -la dist/
          
          # 查找生成的 .app 文件
          cd dist
          APP_DIR=$(find . -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: .app file not found in dist/"
            ls -la
            exit 1
          fi
          echo "Found app directory: $APP_DIR"
          
          # 获取不带路径的 app 名称
          APP_NAME=$(basename "$APP_DIR" .app)
          echo "App name: $APP_NAME"
          
          # 移除隔离属性（防止 macOS 提示"已损坏，无法打开"）
          xattr -r -d com.apple.quarantine "$APP_DIR" 2>/dev/null || true
          echo "Quarantine attribute removed"
          
          # 执行 ad-hoc 签名，确保应用可在本机运行
          codesign --deep --force --sign - "$APP_DIR"
          echo "Ad-hoc signing completed"
          
          # 验证签名
          codesign --verify --deep --strict "$APP_DIR" && echo "Codesign verification passed" || echo "Codesign verification failed"
          
          # 保存原文件名的 zip 和 dmg（由 electron-builder 生成）
          # 查找现有的 zip 和 dmg 文件名
          OLD_ZIP=$(ls ./*.zip 2>/dev/null | head -1)
          OLD_DMG=$(ls ./*.dmg 2>/dev/null | head -1)
          echo "Old ZIP: $OLD_ZIP"
          echo "Old DMG: $OLD_DMG"
          
          # 清理旧产物
          rm -f ./*.zip ./*.dmg
          
          # 重新生成 zip 包
          NEW_ZIP="${APP_NAME}-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc "${APP_NAME}.app" "$NEW_ZIP"
          echo "Created ZIP: $NEW_ZIP"
          
          # 重新生成 dmg
          NEW_DMG="${APP_NAME}-${{ matrix.arch }}.dmg"
          hdiutil create -volname "${APP_NAME}" -srcfolder "${APP_NAME}.app" -ov -format UDZO "$NEW_DMG"
          echo "Created DMG: $NEW_DMG"
          
          # 清理 .app 目录
          rm -rf "${APP_NAME}.app"
          
          cd ..
          echo "Post-processing completed successfully"
          echo "Final files in dist:"
          ls -la dist/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doris-Export-Helper-macOS-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doris-Export-Helper-macOS-${{ matrix.arch }}-zip
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload latest-mac.yml (for auto-updater)
        uses: actions/upload-artifact@v4
        with:
          name: latest-mac-${{ matrix.arch }}
          path: dist/latest-mac.yml
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Release (on tag)
    needs: build-mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: find artifacts -type f

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/latest-mac.yml
          draft: true
          generate_release_notes: true
